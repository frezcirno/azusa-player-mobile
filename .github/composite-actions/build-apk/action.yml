name: Android Build
description: build for android APK

inputs:
  signpwd:
    description: 'release sign pwd in gradle.properties'
    required: false
  signkey:
    description: 'signed key in base64'
    required: false
  buildtype:
    description: 'build type (APK/AAB)'
    default: 'assembleRelease'
    type: choice
    options:
      - assembleRelease
      - bundleRelease

runs:
  using: 'composite'
  steps:
    # When no signing secret is provided (e.g. forks), these steps are skipped
    # and gradle's release config falls back to the bundled debug.keystore.
    - name: Add Build Sign Keys
      if: ${{ inputs.signpwd != '' }}
      env:
        RELEASE_SIGN_PWD: ${{ inputs.signpwd }}
      run: |
        echo "$RELEASE_SIGN_PWD" >> ./android/gradle.properties
      shell: bash

    - name: Build Sign jks
      id: write_file
      if: ${{ inputs.signkey != '' }}
      uses: timheuer/base64-to-file@v2
      with:
        fileName: 'noxupload.jks'
        fileDir: './android/app'
        encodedString: ${{ inputs.signkey }}

    - name: clean generated builds
      run: rm -rf android/app/build/generated/
      shell: bash

    - name: gradle build
      env:
        BUILD: ${{ inputs.buildtype }}
      run: cd android && chmod +x gradlew && ./gradlew "$BUILD"
      shell: bash
